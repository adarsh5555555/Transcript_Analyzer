name: Evals

# The trap checks call the real model, so they cost money: run them on demand
# and weekly, not on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"          # Mondays, 06:00 UTC

jobs:
  traps:
    name: Trap checks against the live model
    runs-on: ubuntu-latest
    if: github.repository_owner != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Quote verification and trap cases
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m evals.trap_checks
